<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Paperfox New Tab</title>
<style>
  :root { --panel-w: min(300px, 85vw); }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  .hidden { display: none !important; }

  /* ---------- Wallpaper ---------- */
  #wallpaper {
    position: fixed;
    inset: 0;
    background-color: #ffffff;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: background 0.3s ease-in-out;
  }

  /* ---------- Search ---------- */
  #search-container {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    max-width: 650px;
    padding: 0 20px;
    z-index: 100;
  }
  #search-bar {
    display: flex;
    align-items: center;
    height: 50px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 25px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    padding-left: 18px;
  }
  #search-input {
    flex: 1;
    height: 100%;
    border: none;
    outline: none;
    font-size: 16px;
    background: transparent;
    color: #333;
    min-width: 0;
  }
  #search-input::placeholder { color: #999; }
  #search-clear {
    width: 46px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 18px;
    cursor: pointer;
  }
  #search-go {
    border: none;
    background: none;
    width: 46px;
    height: 50px;
    font-size: 18px;
    cursor: pointer;
  }
  #search-engines {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
  }
  .search-engine {
    padding: 8px 15px;
    border: none;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.85);
    color: #666;
    font-size: 14px;
    cursor: pointer;
  }
  .search-engine.active {
    background: rgba(52, 152, 219, 0.95);
    color: #fff;
    font-weight: bold;
  }

  /* ---------- Dark-background theme ---------- */
  body.dark-theme #search-bar { background: rgba(40, 40, 40, 0.95); }
  body.dark-theme #search-input { color: #eee; }
  body.dark-theme #search-input::placeholder { color: #aaa; }
  body.dark-theme #search-clear,
  body.dark-theme #search-go { color: #ccc; }
  body.dark-theme .search-engine { background: rgba(60, 60, 60, 0.85); color: #ddd; }
  body.dark-theme .search-engine.active { background: rgba(41, 128, 185, 0.95); color: #fff; }

  /* ---------- Gear button ---------- */
  #gear-button {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    right: 20px;
    width: 50px;
    height: 50px;
    padding: 0;
    background: transparent;
    border: none;
    cursor: pointer;
    z-index: 1200;
    transition: right 0.3s ease-in-out;
  }
  #gear-button.shifted { right: calc(var(--panel-w) + 20px); }
  #gear-icon {
    width: 100%;
    transition: filter 0.3s ease-in-out;
  }
  #gear-icon.gear-black { filter: none; }
  #gear-icon.gear-white {
    filter: invert(1) drop-shadow(0 0 1px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 3px rgba(0, 0, 0, 0.5));
  }

  /* ---------- Settings sidebar ---------- */
  #settings-sidebar {
    position: fixed;
    top: 0;
    right: calc(var(--panel-w) * -1);
    width: var(--panel-w);
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    color: #fff;
    padding: 15px;
    overflow-y: auto;
    transition: right 0.3s ease-in-out;
    z-index: 1100;
  }
  #settings-sidebar.open { right: 0; }
  #sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #sidebar-header h3 { margin: 10px 0 5px; }
  #close-sidebar {
    background: none;
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
  }
  #settings-sidebar h4 { margin: 18px 0 8px; color: #ddd; }
  #uploadWallpaper { display: none; }

  .button-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin: 15px 0;
  }
  .button-style,
  .button-style-label {
    display: flex;
    width: 100%;
    max-width: 260px;
    height: 48px;
    padding: 12px;
    margin: 0;
    background: #3498db;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .button-style:active,
  .button-style-label:active { background: #2980b9; }
  .button-style.alt { background: #555; }
  .button-icon { margin-right: 8px; font-size: 20px; }

  #default-theme {
    width: 100%;
    max-width: 260px;
    height: 80px;
    margin: 10px auto;
    background: #fff;
    border: 2px solid gray;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    color: #000;
    cursor: pointer;
  }
  .fit-option {
    max-width: 260px;
    margin: 0 auto 8px;
    background: #2c2c2c;
    border: 2px solid #444;
    border-radius: 6px;
    padding: 10px;
    cursor: pointer;
  }
  .fit-option.active {
    border-color: #3498db;
    background: #2a3e52;
  }
  .fit-option .title { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
  .fit-option .desc { font-size: 12px; color: #aaa; }

  #history {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .history-item {
    position: relative;
    height: 80px;
    border-radius: 5px;
    background-size: cover;
    background-position: center;
    cursor: pointer;
  }
  .delete-history {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 22px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    border-radius: 50%;
    background: rgba(255, 0, 0, 0.85);
    color: #fff;
    font-size: 12px;
    cursor: pointer;
  }
  .empty-note { color: #888; font-size: 13px; }

  /* ---------- Cropper ---------- */
  #cropper {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    z-index: 2000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 12px;
  }
  #cropper-stage {
    position: relative;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #cropper-image {
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  #crop-frame {
    position: absolute;
    border: 2px dashed #fff;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
    cursor: move;
    touch-action: none;
  }
  #crop-frame::before,
  #crop-frame::after {
    content: "";
    position: absolute;
    background: rgba(255, 255, 255, 0.5);
    pointer-events: none;
  }
  #crop-frame::before {
    left: 50%;
    top: 0;
    bottom: 0;
    width: 1px;
  }
  #crop-frame::after {
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
  }
  .handle {
    position: absolute;
    width: 22px;
    height: 22px;
    background: #3498db;
    border: 2px solid #fff;
    border-radius: 50%;
    touch-action: none;
  }
  .handle.tl { top: -11px; left: -11px; cursor: nwse-resize; }
  .handle.tr { top: -11px; right: -11px; cursor: nesw-resize; }
  .handle.bl { bottom: -11px; left: -11px; cursor: nesw-resize; }
  .handle.br { bottom: -11px; right: -11px; cursor: nwse-resize; }
  #ratio-controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .ratio-button {
    padding: 8px 14px;
    background: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 5px;
    cursor: pointer;
  }
  .ratio-button.active {
    background: #3498db;
    border-color: #3498db;
  }
  #cropper-buttons {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 400px;
  }
  #cropper-buttons .button-style {
    flex: 1;
    max-width: none;
  }

  /* ---------- Modals (color picker, custom position) ---------- */
  .modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    max-width: 90vw;
    max-height: 85vh;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.92);
    color: #fff;
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    z-index: 2100;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #444;
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  .modal-header h3 { margin: 0; font-size: 16px; }
  .close-x {
    background: none;
    border: none;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
  }
  .close-x:hover { color: red; }
  .modal .button-style {
    max-width: none;
    width: 100%;
    margin-top: 10px;
  }
  .color-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }
  #cp-html5 {
    width: 48px;
    height: 38px;
    padding: 0;
    border: none;
    background: none;
    flex-shrink: 0;
  }
  .text-input {
    flex: 1;
    min-width: 0;
    padding: 8px;
    border-radius: 4px;
    border: 1px solid #666;
    background: #333;
    color: #fff;
    font-size: 14px;
  }
  .swatches {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 10px 0;
  }
  .swatch {
    aspect-ratio: 1;
    border-radius: 4px;
    border: 1px solid #666;
    cursor: pointer;
  }
  .preview-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .preview-row .button-style {
    flex: 1;
    width: auto;
    max-width: none;
    margin-top: 0;
  }
  .preview {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid #666;
    flex-shrink: 0;
  }
  .slider-control { margin-bottom: 14px; }
  .slider-label-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #ddd;
    margin-bottom: 5px;
  }
  .slider-value { color: #3498db; }
  .slider-control input[type="range"] { width: 100%; }
</style>
</head>
<body>

<!-- Wallpaper -->
<div id="wallpaper"></div>

<!-- Search bar -->
<div id="search-container">
  <div id="search-bar">
    <input type="text" id="search-input" placeholder="Search the web..." autocomplete="off" enterkeyhint="search">
    <div id="search-clear" class="hidden" role="button" aria-label="Clear">✕</div>
    <button id="search-go" aria-label="Search">🔍</button>
  </div>
  <div id="search-engines">
    <button class="search-engine active" data-engine="google">Google</button>
    <button class="search-engine" data-engine="bing">Bing</button>
    <button class="search-engine" data-engine="duck">DuckDuckGo</button>
    <button class="search-engine" data-engine="youtube">YouTube</button>
  </div>
</div>

<!-- Settings sidebar -->
<div id="settings-sidebar">
  <div id="sidebar-header">
    <h3>Wallpaper Settings</h3>
    <button id="close-sidebar" aria-label="Close">✕</button>
  </div>

  <div class="button-container">
    <label for="uploadWallpaper" class="button-style-label"><span class="button-icon">📂</span> Choose wallpaper file</label>
    <input type="file" id="uploadWallpaper" accept="image/*">
    <button id="chooseColor" class="button-style"><span class="button-icon">🎨</span> Choose background color</button>
  </div>

  <h4>Default Theme</h4>
  <div id="default-theme">White</div>

  <h4>Background display</h4>
  <div id="fit-options"></div>

  <h4>Wallpaper history</h4>
  <div id="history"></div>
  <p class="empty-note" id="history-empty">No wallpapers saved yet.</p>
</div>

<!-- Image cropper -->
<div id="cropper" class="hidden">
  <div id="cropper-stage">
    <img id="cropper-image" alt="">
    <div id="crop-frame">
      <div class="handle tl" data-corner="tl"></div>
      <div class="handle tr" data-corner="tr"></div>
      <div class="handle bl" data-corner="bl"></div>
      <div class="handle br" data-corner="br"></div>
    </div>
  </div>
  <div id="ratio-controls">
    <button class="ratio-button active" data-ratio="free">Free</button>
    <button class="ratio-button" data-ratio="16:9">16:9</button>
    <button class="ratio-button" data-ratio="9:16">9:16</button>
    <button class="ratio-button" data-ratio="1:1">1:1</button>
  </div>
  <div id="cropper-buttons">
    <button id="crop-save" class="button-style">✂️ Crop & save</button>
    <button id="crop-cancel" class="button-style alt">✕ Cancel</button>
  </div>
</div>

<!-- Color picker -->
<div id="color-picker" class="modal hidden">
  <div class="modal-header">
    <h3>Choose background color</h3>
    <button class="close-x" id="cp-close" aria-label="Close">✕</button>
  </div>
  <div class="color-row">
    <input type="color" id="cp-html5" value="#ffffff">
    <input type="text" id="cp-text" class="text-input" placeholder="e.g. #FF0000" value="#ffffff">
  </div>
  <div class="swatches" id="cp-swatches"></div>
  <div class="preview-row">
    <div class="preview" id="cp-preview" style="background:#ffffff"></div>
    <button id="cp-apply" class="button-style">Use this color</button>
  </div>
</div>

<!-- Custom position & size -->
<div id="custom-position" class="modal hidden">
  <div class="modal-header">
    <h3>Adjust position & size</h3>
    <button class="close-x" id="cu-close" aria-label="Close">✕</button>
  </div>
  <div class="slider-control">
    <div class="slider-label-row"><span>Horizontal position</span><span class="slider-value" id="pos-x-value">50%</span></div>
    <input type="range" id="pos-x" min="0" max="100" value="50">
  </div>
  <div class="slider-control">
    <div class="slider-label-row"><span>Vertical position</span><span class="slider-value" id="pos-y-value">50%</span></div>
    <input type="range" id="pos-y" min="0" max="100" value="50">
  </div>
  <div class="slider-control">
    <div class="slider-label-row"><span>Size</span><span class="slider-value" id="size-value">100%</span></div>
    <input type="range" id="size" min="50" max="200" value="100">
  </div>
  <button id="cu-save" class="button-style">Save settings</button>
</div>

<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const wall = $("wallpaper");
  const gearBtn = $("gear-button");
  const gearIcon = $("gear-icon");
  const sidebar = $("settings-sidebar");

  // ---------- State & storage ----------
  const KEY = "paperfox_mobile_v2";
  const MAX_HISTORY = 8;
  const DEFAULT_STATE = {
    wallpaper: null,                                  // data URL or null
    color: "#ffffff",                                 // used when no wallpaper
    fit: "cover",                                     // cover | contain | custom
    customBg: { posX: 50, posY: 50, size: 100 },
    history: [],
    gearOverride: null,                               // null | "white" | "black"
    engine: "google"
  };

  let state = load();

  function load() {
    try {
      return Object.assign({}, DEFAULT_STATE, JSON.parse(localStorage.getItem(KEY)) || {});
    } catch (e) {
      return Object.assign({}, DEFAULT_STATE);
    }
  }

  function persist() {
    while (true) {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
        return true;
      } catch (e) {
        if (state.history.length) { state.history.pop(); continue; }
        alert("Not enough storage space for this image.");
        return false;
      }
    }
  }

  // ---------- Brightness helpers (decide text & gear color) ----------
  const brightCache = new Map();
  let lastBrightness = 255;

  function brightnessRGB(r, g, b) {
    return r * 0.299 + g * 0.587 + b * 0.114;
  }

  function brightnessOfHex(hex) {
    const h = hex.replace("#", "");
    const f = h.length === 3 ? h.split("").map(c => c + c).join("") : h;
    return brightnessRGB(
      parseInt(f.substr(0, 2), 16),
      parseInt(f.substr(2, 2), 16),
      parseInt(f.substr(4, 2), 16)
    );
  }

  function brightnessOfImage(src) {
    if (brightCache.has(src)) return Promise.resolve(brightCache.get(src));
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = c.height = 24;
        const ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0, 24, 24);
        const d = ctx.getImageData(0, 0, 24, 24).data;
        let sum = 0;
        for (let i = 0; i < d.length; i += 4) sum += brightnessRGB(d[i], d[i + 1], d[i + 2]);
        const avg = sum / (d.length / 4);
        brightCache.set(src, avg);
        resolve(avg);
      };
      img.onerror = () => resolve(255);
      img.src = src;
    });
  }

  function updateTheme(b) {
    if (typeof b === "number") lastBrightness = b;
    const dark = lastBrightness < 128;
    document.body.classList.toggle("dark-theme", dark);
    const whiteGear = state.gearOverride ? state.gearOverride === "white" : dark;
    gearIcon.className = whiteGear ? "gear-white" : "gear-black";
  }

  // ---------- Wallpaper rendering ----------
  function applyFit(fit, cb) {
    wall.style.backgroundRepeat = "no-repeat";
    if (fit === "contain") {
      wall.style.backgroundSize = "contain";
      wall.style.backgroundPosition = "center";
    } else if (fit === "custom") {
      wall.style.backgroundSize = cb.size + "%";
      wall.style.backgroundPosition = `${cb.posX}% ${cb.posY}%`;
    } else {
      wall.style.backgroundSize = "cover";
      wall.style.backgroundPosition = "center";
    }
  }

  function applyWallpaper() {
    if (state.wallpaper) {
      wall.style.backgroundColor = "#000";
      wall.style.backgroundImage = `url("${state.wallpaper}")`;
      applyFit(state.fit, state.customBg);
      brightnessOfImage(state.wallpaper).then(updateTheme);
    } else {
      wall.style.backgroundImage = "none";
      wall.style.backgroundColor = state.color;
      updateTheme(brightnessOfHex(state.color));
    }
    markFitOptions();
  }

  // ---------- Search ----------
  const searchInput = $("search-input");
  const searchClear = $("search-clear");
  const engines = {
    google: q => `https://www.google.com/search?q=${encodeURIComponent(q)}`,
    bing: q => `https://www.bing.com/search?q=${encodeURIComponent(q)}`,
    duck: q => `https://duckduckgo.com/?q=${encodeURIComponent(q)}`,
    youtube: q => `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`
  };

  function doSearch() {
    const q = searchInput.value.trim();
    if (!q) return;
    window.open(engines[state.engine](q), "_blank", "noopener");
    searchInput.value = "";
    searchClear.classList.add("hidden");
  }

  function highlightEngine() {
    document.querySelectorAll(".search-engine").forEach(b =>
      b.classList.toggle("active", b.dataset.engine === state.engine));
  }

  searchInput.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
  $("search-go").addEventListener("click", doSearch);
  searchInput.addEventListener("input", () =>
    searchClear.classList.toggle("hidden", !searchInput.value.trim()));
  searchClear.addEventListener("click", () => {
    searchInput.value = "";
    searchClear.classList.add("hidden");
  });
  document.querySelectorAll(".search-engine").forEach(btn => {
    btn.addEventListener("click", () => {
      state.engine = btn.dataset.engine;
      persist();
      highlightEngine();
    });
  });

  // ---------- Sidebar & gear ----------
  function openSidebar() {
    sidebar.classList.add("open");
    gearBtn.classList.add("shifted");
  }
  function closeSidebar() {
    sidebar.classList.remove("open");
    gearBtn.classList.remove("shifted");
  }

  // Single tap toggles the sidebar; double tap flips gear color.
  // The delay stops a double tap from also opening and closing the sidebar.
  let tapTimer = null;
  gearBtn.addEventListener("click", () => {
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => {
      sidebar.classList.contains("open") ? closeSidebar() : openSidebar();
    }, 250);
  });
  gearBtn.addEventListener("dblclick", () => {
    clearTimeout(tapTimer);
    const isWhite = gearIcon.className === "gear-white";
    state.gearOverride = isWhite ? "black" : "white";
    persist();
    updateTheme();
  });
  $("close-sidebar").addEventListener("click", closeSidebar);

  // Default theme (white)
  $("default-theme").addEventListener("click", () => {
    state.wallpaper = null;
    state.color = "#ffffff";
    persist();
    applyWallpaper();
  });

  // ---------- Background fit options ----------
  const FITS = [
    { id: "cover", title: "Fill screen", desc: "Covers the whole screen (may crop edges)" },
    { id: "contain", title: "Fit whole image", desc: "Shows the full picture (may leave gaps)" },
    { id: "custom", title: "Custom", desc: "Set position and size yourself" }
  ];

  function renderFits() {
    const box = $("fit-options");
    box.innerHTML = "";
    FITS.forEach(f => {
      const el = document.createElement("div");
      el.className = "fit-option";
      el.dataset.fit = f.id;
      el.innerHTML = `<div class="title">${f.title}</div><div class="desc">${f.desc}</div>`;
      el.addEventListener("click", () => chooseFit(f.id));
      box.appendChild(el);
    });
    markFitOptions();
  }

  function markFitOptions() {
    document.querySelectorAll(".fit-option").forEach(el =>
      el.classList.toggle("active", el.dataset.fit === state.fit));
  }

  function chooseFit(id) {
    if (id === "custom") { openCustom(); return; }
    state.fit = id;
    persist();
    applyWallpaper();
  }

  // ---------- Custom position & size modal ----------
  const sliderIds = ["pos-x", "pos-y", "size"];

  function readCustom() {
    return {
      posX: +$("pos-x").value,
      posY: +$("pos-y").value,
      size: +$("size").value
    };
  }

  function paintCustom() {
    const v = readCustom();
    $("pos-x-value").textContent = v.posX + "%";
    $("pos-y-value").textContent = v.posY + "%";
    $("size-value").textContent = v.size + "%";
    if (state.wallpaper) {
      wall.style.backgroundColor = "#000";
      wall.style.backgroundImage = `url("${state.wallpaper}")`;
      applyFit("custom", v);   // live preview
    }
  }

  function openCustom() {
    if (!state.wallpaper) {
      alert("Choose a wallpaper image first.");
      return;
    }
    closeSidebar();
    $("pos-x").value = state.customBg.posX;
    $("pos-y").value = state.customBg.posY;
    $("size").value = state.customBg.size;
    paintCustom();
    $("custom-position").classList.remove("hidden");
  }

  sliderIds.forEach(id => $(id).addEventListener("input", paintCustom));
  $("cu-close").addEventListener("click", () => {
    $("custom-position").classList.add("hidden");
    applyWallpaper();   // revert the live preview
  });
  $("cu-save").addEventListener("click", () => {
    state.fit = "custom";
    state.customBg = readCustom();
    persist();
    $("custom-position").classList.add("hidden");
    applyWallpaper();
  });

  // ---------- Image cropper ----------
  const RATIOS = { free: null, "16:9": 16 / 9, "9:16": 9 / 16, "1:1": 1 };
  const stage = $("cropper-stage");
  const cImg = $("cropper-image");
  const frame = $("crop-frame");
  const crop = {
    dw: 0, dh: 0,          // displayed size on screen
    nw: 0, nh: 0,          // natural size of the image
    box: { x: 0, y: 0, w: 0, h: 0 },
    ratio: null,
    drag: null
  };

  function openCropper(src) {
    closeSidebar();
    const img = new Image();
    img.onload = () => {
      crop.nw = img.naturalWidth;
      crop.nh = img.naturalHeight;
      const maxW = Math.min(window.innerWidth * 0.92, 900);
      const maxH = window.innerHeight * 0.6;
      const s = Math.min(maxW / crop.nw, maxH / crop.nh, 1);
      crop.dw = Math.round(crop.nw * s);
      crop.dh = Math.round(crop.nh * s);

      cImg.src = src;
      cImg.style.width = crop.dw + "px";
      cImg.style.height = crop.dh + "px";
      stage.style.width = crop.dw + "px";
      stage.style.height = crop.dh + "px";

      const w = crop.dw * 0.8, h = crop.dh * 0.8;
      crop.box = { x: (crop.dw - w) / 2, y: (crop.dh - h) / 2, w, h };
      crop.ratio = null;
      setRatioButtons("free");
      renderFrame();
      $("cropper").classList.remove("hidden");
    };
    img.onerror = () => alert("Could not open that image.");
    img.src = src;
  }

  function renderFrame() {
    const b = crop.box;
    frame.style.left = b.x + "px";
    frame.style.top = b.y + "px";
    frame.style.width = b.w + "px";
    frame.style.height = b.h + "px";
  }

  function setRatioButtons(name) {
    document.querySelectorAll(".ratio-button").forEach(b =>
      b.classList.toggle("active", b.dataset.ratio === name));
  }

  function fitBoxToRatio(r) {
    const b = crop.box;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    let w = b.w, h = b.h;
    if (w / h > r) w = h * r; else h = w / r;
    crop.box = {
      x: clamp(cx - w / 2, 0, crop.dw - w),
      y: clamp(cy - h / 2, 0, crop.dh - h),
      w, h
    };
  }

  // Resize from a corner, keeping the opposite corner fixed
  function resizeFromCorner(corner, s, dx, dy) {
    const right = corner.includes("r");
    const bottom = corner.includes("b");

    // Fixed (anchor) corner
    const ax = right ? s.x : s.x + s.w;
    const ay = bottom ? s.y : s.y + s.h;

    // Where the dragged corner is now
    const px = clamp((right ? s.x + s.w : s.x) + dx, 0, crop.dw);
    const py = clamp((bottom ? s.y + s.h : s.y) + dy, 0, crop.dh);

    let w = Math.max(Math.abs(px - ax), 30);
    let h = Math.max(Math.abs(py - ay), 30);

    const r = crop.ratio;
    if (r) {
      if (w < h * r) w = h * r;
      h = w / r;
    }

    // Room available from the anchor toward the dragged side
    const roomX = right ? crop.dw - ax : ax;
    const roomY = bottom ? crop.dh - ay : ay;
    const k = Math.min(1, roomX / w, roomY / h);
    w *= k;
    h *= k;

    crop.box = {
      x: right ? ax : ax - w,
      y: bottom ? ay : ay - h,
      w,
      h
    };
  }

  frame.addEventListener("pointerdown", e => {
    e.preventDefault();
    e.stopPropagation();
    const corner = e.target.dataset ? e.target.dataset.corner : undefined;
    crop.drag = {
      mode: corner ? "resize" : "move",
      corner,
      sx: e.clientX,
      sy: e.clientY,
      start: Object.assign({}, crop.box)
    };
  });

  window.addEventListener("pointermove", e => {
    const d = crop.drag;
    if (!d) return;
    const dx = e.clientX - d.sx;
    const dy = e.clientY - d.sy;
    const s = d.start;
    if (d.mode === "move") {
      crop.box.x = clamp(s.x + dx, 0, crop.dw - s.w);
      crop.box.y = clamp(s.y + dy, 0, crop.dh - s.h);
    } else {
      resizeFromCorner(d.corner, s, dx, dy);
    }
    renderFrame();
  });

  const endDrag = () => { crop.drag = null; };
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);

  document.querySelectorAll(".ratio-button").forEach(btn => {
    btn.addEventListener("click", () => {
      setRatioButtons(btn.dataset.ratio);
      crop.ratio = RATIOS[btn.dataset.ratio];
      if (crop.ratio) fitBoxToRatio(crop.ratio);
      renderFrame();
    });
  });

  function closeCropper() {
    $("cropper").classList.add("hidden");
    cImg.removeAttribute("src");
  }

  $("crop-cancel").addEventListener("click", closeCropper);

  $("crop-save").addEventListener("click", () => {
    const k = crop.nw / crop.dw;          // screen px -> natural image px
    const b = crop.box;
    const sx = b.x * k, sy = b.y * k, sw = b.w * k, sh = b.h * k;

    const cap = Math.min(1, 1600 / Math.max(sw, sh));   // keep saved size reasonable
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(sw * cap));
    c.height = Math.max(1, Math.round(sh * cap));
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#ffffff";           // no black areas for transparent PNGs
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(cImg, sx, sy, sw, sh, 0, 0, c.width, c.height);

    const out = c.toDataURL("image/jpeg", 0.88);
    state.wallpaper = out;
    state.history = [out, ...state.history.filter(h => h !== out)].slice(0, MAX_HISTORY);
    persist();
    closeCropper();
    applyWallpaper();
    renderHistory();
  });

  $("uploadWallpaper").addEventListener("change", e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => openCropper(reader.result);
    reader.readAsDataURL(file);
  });

  // ---------- Color picker ----------
  const cpPreview = $("cp-preview");
  const cpText = $("cp-text");
  const cpHtml5 = $("cp-html5");
  const COLOR_RE = /^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$/;

  function openColorPicker() {
    closeSidebar();
    cpHtml5.value = /^#[0-9a-f]{6}$/i.test(state.color) ? state.color : "#ffffff";
    cpText.value = cpHtml5.value;
    cpPreview.style.background = cpHtml5.value;
    $("color-picker").classList.remove("hidden");
  }

  function setColor(c) {
    state.wallpaper = null;
    state.color = c;
    persist();
    applyWallpaper();
    $("color-picker").classList.add("hidden");
  }

  const PALETTE = [
    "#000000", "#FFFFFF", "#FF0000", "#00FF00",
    "#0000FF", "#FFFF00", "#FF00FF", "#00FFFF",
    "#FF8800", "#88FF00", "#0088FF", "#FF0088"
  ];
  PALETTE.forEach(c => {
    const s = document.createElement("div");
    s.className = "swatch";
    s.style.background = c;
    s.title = c;
    s.addEventListener("click", () => setColor(c));
    $("cp-swatches").appendChild(s);
  });

  cpHtml5.addEventListener("input", () => {
    cpText.value = cpHtml5.value;
    cpPreview.style.background = cpHtml5.value;
  });
  cpText.addEventListener("input", () => {
    const v = cpText.value.trim();
    if (COLOR_RE.test(v)) cpPreview.style.background = v;
  });
  $("cp-apply").addEventListener("click", () => {
    const v = cpText.value.trim();
    if (COLOR_RE.test(v)) setColor(v);
    else alert("Please enter a color like #FF0000");
  });
  $("cp-close").addEventListener("click", () => $("color-picker").classList.add("hidden"));
  $("chooseColor").addEventListener("click", openColorPicker);

  // ---------- History ----------
  function renderHistory() {
    const box = $("history");
    box.innerHTML = "";
    $("history-empty").classList.toggle("hidden", state.history.length > 0);

    state.history.forEach((img, i) => {
      const item = document.createElement("div");
      item.className = "history-item";
      item.style.backgroundImage = `url("${img}")`;
      item.addEventListener("click", () => {
        state.wallpaper = img;
        persist();
        applyWallpaper();
      });

      const del = document.createElement("div");
      del.className = "delete-history";
      del.textContent = "✕";
      del.addEventListener("click", ev => {
        ev.stopPropagation();
        state.history.splice(i, 1);
        persist();
        renderHistory();
      });

      item.appendChild(del);
      box.appendChild(item);
    });
  }

  // ---------- Init ----------
  renderFits();
  renderHistory();
  highlightEngine();
  applyWallpaper();
})();
</script>
</body>
</html>
